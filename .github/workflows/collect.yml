# Collect cross-market iPhone prices on a free-tier-safe cadence.
#
# Budget (designed to stay under free limits):
#   - PricesAPI: 8 countries × 2 runs/day × 30 days ≈ 480 credits/month
#   - GitHub Actions: ~60 jobs/month × 10–15 min ≈ 600–900 min
#   - Git storage: only data/prices.db is committed (stays small)
#
# Schedule: every 12 hours UTC.
# Manual: Actions → Collect prices → Run workflow
# Important: use "Run workflow" (not "Re-run jobs") so the latest YAML is used.

name: Collect prices

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

concurrency:
  group: collect-prices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one collection cycle
        env:
          PRICESAPI_KEY_1: ${{ secrets.PRICESAPI_KEY_1 }}
          PRICESAPI_KEY_2: ${{ secrets.PRICESAPI_KEY_2 }}
          PRICESAPI_KEY_3: ${{ secrets.PRICESAPI_KEY_3 }}
          PRICESAPI_KEY_4: ${{ secrets.PRICESAPI_KEY_4 }}
          PRICESAPI_KEY_5: ${{ secrets.PRICESAPI_KEY_5 }}
          EXCHANGERATE_HOST_ACCESS_KEY: ${{ secrets.EXCHANGERATE_HOST_ACCESS_KEY }}
          DATABASE_PATH: data/prices.db
        run: python scheduler.py --once

      - name: Commit and push updated database
        run: |
          set -euo pipefail

          if [ ! -f data/prices.db ]; then
            echo "No database file found — nothing to commit."
            exit 0
          fi

          # Keep the DB produced by this job, even if we reset the git tree
          cp data/prices.db /tmp/prices-collected.db

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}..."

            git fetch origin main
            git reset --hard origin/main

            mkdir -p data
            cp /tmp/prices-collected.db data/prices.db
            git add data/prices.db

            if git diff --staged --quiet; then
              echo "Database unchanged vs origin/main — nothing to commit."
              exit 0
            fi

            git commit -m "data: update price snapshots from scheduled collection"

            if git push origin HEAD:main; then
              echo "Push succeeded"
              exit 0
            fi

            echo "Push rejected (main moved). Retrying..."
            sleep $((attempt * 3))
          done

          echo "Failed to push database after retries"
          exit 1
